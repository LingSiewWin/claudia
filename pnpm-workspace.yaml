packages:
  - "apps/*"
  - "packages/*"
  - "workflows/*"
  - "scripts"
allowBuilds:
  esbuild: false
  chacha-native: false
packageExtensions:
  "@chainlink/cre-sdk":
    dependencies:
      typescript: 5.9.3
  "@connectrpc/connect":
    dependencies:
      "@bufbuild/protobuf": "1.10.1"
# Mesh 1.9.1 pulls @connectrpc/connect@1.4.0, which peers @bufbuild/protobuf@^1.4.2
# (exports protoBase64). CRE already has protobuf 2.6.3; autoInstallPeers was
# wiring connect to v2, which dropped that named export.
overrides:
  "@connectrpc/connect>@bufbuild/protobuf": "1.10.1"
  "@connectrpc/connect-node>@bufbuild/protobuf": "1.10.1"
  "@connectrpc/connect-web>@bufbuild/protobuf": "1.10.1"
  # @meshsdk/provider pulls @utxorpc/sdk, whose connect-node transport (unused here, Blockfrost only) pins old
  # undici, ip-address and busboy with published advisories; the patched lines are the same ones Node 24 ships.
  "undici@<6.28.1": ">=6.28.1 <7"
  "ip-address@<10.7.1": ">=10.7.1"
  "@fastify/busboy@<3.2.2": ">=3.2.2"
